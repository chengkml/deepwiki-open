name: deepwiki 镜像构建与部署

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deepwiki-build-and-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY || 'crpi-u265r07n4blchcqo.cn-shanghai.personal.cr.aliyuncs.com' }}
  REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'ck-registry' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      deepwiki_image: ${{ steps.vars.outputs.deepwiki_image }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "deepwiki_image=${{ env.REGISTRY }}/${NS}/deepwiki" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=docker.m.daocloud.io/moby/buildkit:buildx-stable-1

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 deepwiki 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          tags: |
            ${{ steps.vars.outputs.deepwiki_image }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.deepwiki_image }}:latest
          cache-from: type=gha,scope=deepwiki
          cache-to: type=gha,mode=max,scope=deepwiki

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 校验部署参数
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${SERVER_HOST}" ] || { echo "::error::缺少 SERVER_HOST（请在 Secrets 或 Variables 中配置）"; exit 1; }
          [ -n "${SERVER_USER}" ] || { echo "::error::缺少 SERVER_USER（请在 Secrets 或 Variables 中配置）"; exit 1; }
          if [ -z "${SERVER_SSH_KEY}" ] && [ -z "${SERVER_PASSWORD}" ]; then
            echo "::error::缺少登录凭据：请至少配置 SERVER_SSH_KEY 或 SERVER_PASSWORD"
            exit 1
          fi
          [ -n "${REGISTRY_USERNAME}" ] || { echo "::error::缺少 REGISTRY_USERNAME"; exit 1; }
          [ -n "${REGISTRY_PASSWORD}" ] || { echo "::error::缺少 REGISTRY_PASSWORD"; exit 1; }

      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 准备远端部署目录
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
          timeout: 120s
          command_timeout: 10m
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_DIR="${DEPLOY_PATH:-/opt/deepwiki}"
            mkdir -p "${DEPLOY_DIR}"

      - name: 通过 SSH 拉取并更新容器
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEEPWIKI_IMAGE: ${{ needs.build-and-push.outputs.deepwiki_image }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
          timeout: 120s
          command_timeout: 45m
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: DEPLOY_PATH,DEEPWIKI_IMAGE,IMAGE_TAG,REGISTRY,REGISTRY_USERNAME,REGISTRY_PASSWORD
          script: |
            set -euo pipefail
            export DOCKER_CLIENT_TIMEOUT="${DOCKER_CLIENT_TIMEOUT:-600}"
            export COMPOSE_HTTP_TIMEOUT="${COMPOSE_HTTP_TIMEOUT:-600}"

            DEPLOY_DIR="${DEPLOY_PATH:-/opt/deepwiki}"
            mkdir -p "${DEPLOY_DIR}"
            cd "${DEPLOY_DIR}"

            # 创建生产环境的 docker-compose.yml
            cat > docker-compose.yml <<'COMPOSE_EOF'
            version: '3.8'

            services:
              deepwiki:
                image: ${DEEPWIKI_IMAGE}
                container_name: deepwiki
                restart: unless-stopped
                ports:
                  - "${PORT:-8001}:${PORT:-8001}"
                  - "3000:3000"
                environment:
                  - PORT=${PORT:-8001}
                  - NODE_ENV=production
                  - SERVER_BASE_URL=http://localhost:${PORT:-8001}
                  - LOG_LEVEL=${LOG_LEVEL:-INFO}
                  - LOG_FILE_PATH=${LOG_FILE_PATH:-api/logs/application.log}
                  - OPENAI_API_KEY=${OPENAI_API_KEY}
                  - GOOGLE_API_KEY=${GOOGLE_API_KEY}
                volumes:
                  - deepwiki_adalflow:/root/.adalflow
                  - deepwiki_logs:/app/api/logs
                  - deepwiki_data:/app/data
                mem_limit: 6g
                mem_reservation: 2g
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8001}/health"]
                  interval: 60s
                  timeout: 10s
                  retries: 3
                  start_period: 30s

            volumes:
              deepwiki_adalflow:
              deepwiki_logs:
              deepwiki_data:
            COMPOSE_EOF

            # 创建 .env 文件（如果不存在）
            if [ ! -f .env ]; then
              cat > .env <<'ENV_EOF'
            # DeepWiki 环境变量
            # 请根据实际需求配置以下变量
            PORT=8001
            LOG_LEVEL=INFO
            OPENAI_API_KEY=
            GOOGLE_API_KEY=
            ENV_EOF
              echo "[info] 已创建默认 .env 文件，请根据需要配置环境变量"
            fi

            # 创建镜像环境变量文件
            cat > .images.env <<ENV
            DEEPWIKI_IMAGE=${DEEPWIKI_IMAGE}:${IMAGE_TAG}
            ENV

            echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin

            COMPOSE_CMD="docker compose"
            if ! docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            fi

            compose_run() {
              ${COMPOSE_CMD} --env-file .env --env-file .images.env -f docker-compose.yml "$@"
            }

            pull_with_retry() {
              local max_retries=3
              local attempt=1
              while true; do
                if compose_run pull; then
                  break
                fi
                if [ "${attempt}" -ge "${max_retries}" ]; then
                  echo "[error] docker compose pull failed after ${max_retries} attempts."
                  return 1
                fi
                local sleep_seconds=$((attempt * 20))
                echo "[warn] docker compose pull failed (attempt ${attempt}/${max_retries}), retrying in ${sleep_seconds}s..."
                sleep "${sleep_seconds}"
                attempt=$((attempt + 1))
              done
            }

            pull_with_retry
            if ! compose_run up -d --remove-orphans; then
              echo "[error] docker compose up failed, collecting container diagnostics..."
              compose_run ps || true
              compose_run logs --no-color --tail 300 deepwiki || true
              exit 1
            fi
            compose_run ps
